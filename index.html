</style></head><body><aside><div class="brand">◈ &nbsp;PERFORMANCE<span>Finance intelligence / 27</span></div><nav class="nav" id="nav"></nav><div class="aside-foot">ECON 449 · ARÇELIK<br>Illustrative data only</div></aside><main class="shell"><header><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="subtitle"></p></div><div class="tag">● &nbsp; DEMO DATA &nbsp; / &nbsp; EUR</div></header><div class="filters" id="filters"></div><div class="guide" id="guide"></div><div id="content"></div><div class="foot">PERFORMANCE & VARIANCE COPILOT &nbsp; / &nbsp; DESCRIPTIVE ANALYSIS &nbsp; / &nbsp; ALL DATA IS SYNTHETIC</div></main>
<script>
'use strict';
const countries=[['Türkiye','TRY',.029,1.38],['Germany','EUR',1,1.13],['United Kingdom','GBP',1.17,1.05],['France','EUR',1,.91],['Poland','PLN',.23,.79],['Romania','RON',.20,.57]], brands=[['Beko',1],['Arçelik',1.13],['Grundig',1.27]], channels=[['Retail',1],['Online',.73],['Dealer',.86]];
const rows=[];for(let m=0;m<36;m++){let date=`${2023+Math.floor(m/12)}-${String(m%12+1).padStart(2,'0')}`;countries.forEach(([country,currency,fx,scale],ci)=>brands.forEach(([brand,bp],bi)=>channels.forEach(([channel,cs],hi)=>{let season=1+.13*Math.sin((m%12-3)*Math.PI/6),base=1350*scale*cs*(1-bi*.15)*season*(1+.008*m),bu=Math.round(base),au=Math.round(base*(1+.08*Math.sin(m*.55+ci*1.8+bi*.7+hi*.5)+[.015,-.065,.075,-.025,.045,-.075][ci])),bf=fx*(1-.002*m*(ci===0?1.9:ci===4?.3:0)),af=bf*(1+.025*Math.sin(m*.27+ci)),price=(270+bi*65+hi*12)/bf,ap=price*(1+.025*Math.cos(m*.4+ci+bi)),br=bu*price,ar=au*ap,bc=br*(.66+bi*.015+hi*.01),ac=ar*(.66+bi*.015+hi*.01+.018*Math.sin(m*.31+ci+hi));rows.push({date,country,currency,brand,channel,budget_units:bu,actual_units:au,budget_revenue_local:br,actual_revenue_local:ar,budget_cogs_local:bc,actual_cogs_local:ac,budget_fx:bf,actual_fx:af})}))) }
const state={page:'overview',period:'2025-12',country:'All',brand:'All',channel:'All',detail:'Türkiye',query:'',sort:'variance',direction:1};const pages=[['overview','Overview'],['drivers','Variance drivers'],['countries','Countries'],['detail','Country detail'],['definitions','Definitions & data']];
const sum=(a,f)=>a.reduce((s,r)=>s+f(r),0), money=n=>Number.isFinite(n)?'€'+(Math.abs(n)>=1e6?(n/1e6).toFixed(2)+'m':(n/1e3).toFixed(0)+'k'):'N/A', pct=n=>Number.isFinite(n)?(n>0?'+':'')+(100*n).toFixed(1)+'%':'N/A', pp=n=>Number.isFinite(n)?(n>0?'+':'')+(100*n).toFixed(1)+' pp':'N/A', ratio=(a,b)=>b? a/b:null, cls=n=>n<0?'negative':'positive';
function selected(date=state.period,ignoreCountry=false){let year=+state.period.slice(0,4);return rows.filter(r=>(date==='YTD'?r.date.startsWith(String(year))&&r.date<=state.period:r.date===date)&&(ignoreCountry||state.country==='All'||r.country===state.country)&&(state.brand==='All'||r.brand===state.brand)&&(state.channel==='All'||r.channel===state.channel))}function metrics(rs){let a=sum(rs,r=>r.actual_revenue_local*r.actual_fx),b=sum(rs,r=>r.budget_revenue_local*r.budget_fx),ac=sum(rs,r=>r.actual_cogs_local*r.actual_fx),bc=sum(rs,r=>r.budget_cogs_local*r.budget_fx);return {a,b,g:a-ac,bg:b-bc,rate:ratio(a-ac,a),brate:ratio(b-bc,b),variance:b?(a-b)/b:null}}
function current(){return selected(state.period)}function previous(){let p=state.period;return selected((+p.slice(0,4)-1)+p.slice(4))}function countryRows(rs){return countries.map(c=>{let x=rs.filter(r=>r.country===c[0]),p=previous().filter(r=>r.country===c[0]),m=metrics(x);return {name:c[0],...m,ly:metrics(p).a,has:x.length>0}}).filter(x=>x.has)}
function bridge(rs){let result={volume:0,mix:0,price:0,fx:0};let groups={};rs.forEach(r=>(groups[r.date+'|'+r.country]??=[]).push(r));Object.values(groups).forEach(g=>{let qb=sum(g,r=>r.budget_units),qa=sum(g,r=>r.actual_units);if(!qb||!qa)return;let avg=sum(g,r=>r.budget_revenue_local*r.budget_fx)/qb;result.volume+=(qa-qb)*avg;g.forEach(r=>{let pb=r.budget_revenue_local/r.budget_units,pa=r.actual_revenue_local/r.actual_units;result.mix+=qa*(r.actual_units/qa-r.budget_units/qb)*pb*r.budget_fx;result.price+=r.actual_units*(pa-pb)*r.budget_fx;result.fx+=r.actual_units*pa*(r.actual_fx-r.budget_fx)})});return result}
function nav(page){state.page=page;render()}function detail(c){state.detail=c;state.page='detail';render()}function filter(name,vals,val){return `<div class="filter"><label for="${name}">${name}</label><select id="${name}" onchange="setFilter('${name}',this.value)">${vals.map(v=>`<option ${v===val?'selected':''}>${v}</option>`).join('')}</select></div>`}function setFilter(k,v){state[k]=v;render()}function reset(){Object.assign(state,{period:'2025-12',country:'All',brand:'All',channel:'All',query:''});render()}
function kpi(label,value,sub){return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}function cards(rs,prev){let m=metrics(rs),l=metrics(prev),y=l.a?(m.a-l.a)/l.a:null,gm=l.rate===null||m.rate===null?null:m.rate-l.rate;return `<div class="grid kpis">${kpi('Revenue',money(m.a),'Actual · reporting currency')}${kpi('Revenue vs budget',pct(m.variance),`${money(m.a-m.b)} vs ${money(m.b)} budget`)}${kpi('Revenue vs last year',pct(y),`${money(l.a)} in prior year`)}${kpi('Gross margin',money(m.g),`${pct(m.rate)} of revenue`)}${kpi('Margin rate vs budget',pp(m.rate-m.brate),`${pct(m.brate)} budget margin`)}${kpi('Margin rate vs last year',pp(gm),`${l.rate===null?'N/A':pct(l.rate)} prior-year margin`)}</div>`}
function trend(rsCountry){let dates=[...new Set(rows.map(r=>r.date))].filter(d=>d<=state.period).slice(-12),data=dates.map(d=>{let r=selected(d);if(rsCountry)r=r.filter(x=>x.country===rsCountry);return metrics(r)}),max=Math.max(...data.map(x=>Math.max(x.a,x.b)),1),x=i=>45+i*60,y=v=>190-v/max*155,points=k=>data.map((v,i)=>`${x(i)},${y(v[k])}`).join(' ');return `<div class="chart"><svg viewBox="0 0 740 235" role="img" aria-label="Monthly actual and budget revenue trend"><line x1="45" y1="190" x2="710" y2="190" stroke="#e6ece5"/><line x1="45" y1="112" x2="710" y2="112" stroke="#eff3ee"/><text x="0" y="20" fill="#9ca99f" font-size="10">${money(max)}</text><text x="5" y="190" fill="#9ca99f" font-size="10">€0</text><polyline points="${points('b')}" fill="none" stroke="#becdc0" stroke-width="3" stroke-dasharray="5 5"/><polyline points="${points('a')}" fill="none" stroke="#2a6d4d" stroke-width="3"/>${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.a)}" r="4" fill="#2a6d4d"><title>${dates[i]}: ${money(d.a)} actual, ${money(d.b)} budget</title></circle><text x="${x(i)}" y="215" text-anchor="middle" fill="#9ba89e" font-size="10">${dates[i].slice(5)}</text>`).join('')}</svg></div><div class="legend"><i></i>Actual <i class="b"></i>Budget · previous 12 months ending in selected month</div>`}
function rankings(cs){if(!cs.length)return '<div class="empty">No results for these filters.</div>';return cs.sort((a,b)=>a.variance-b.variance).map((c,i)=>`<div class="row"><span class="rank">0${i+1}</span><strong><button class="textbutton" onclick="detail('${c.name}')">${c.name} ↗</button></strong><span class="${cls(c.variance)}">${pct(c.variance)}</span></div>`).join('')}
function breakdown(rs,field){let groups=[...new Set(rs.map(r=>r[field]))].map(name=>({name,value:metrics(rs.filter(r=>r[field]===name)).a})).sort((a,b)=>b.value-a.value),max=Math.max(...groups.map(x=>x.value),1);return groups.map(g=>`<div class="row"><strong>${g.name}</strong><div class="bartrack"><div class="barfill" style="width:${100*g.value/max}%"></div></div><span>${money(g.value)}</span></div>`).join('')||'<div class="empty">No data</div>'}
function waterfall(rs){
  if(!rs.length)return '<div class="empty">No data for this selection. Adjust the filters to see the bridge.</div>';
  const m=metrics(rs), b=bridge(rs), effects=[['Volume',b.volume],['Mix',b.mix],['Price',b.price],['FX',b.fx]];
  const signed=v=>(v<0?'−':v>0?'+':'')+money(Math.abs(v));

  const drivers=effects.map(([name,value])=>`<div class="driver-row"><div><strong>${name}</strong><small>${explanations[name]}</small></div><div class="driver-track"><span style="width:${Math.abs(value)/Math.max(...effects.map(e=>Math.abs(e[1])),1)*50}%;${value<0?'right:50%':'left:50%'};background:${value<0?'#c8786c':'#699a79'}"></span></div><b class="${cls(value)}">${signed(value)}</b></div>`).join('');
  return `<div class="bridge-summary"><div><span>BUDGET REVENUE</span><strong>${money(m.b)}</strong></div><div><span>NET VARIANCE</span><strong class="${cls(cumulative)}">${signed(cumulative)}</strong><small>${pct(m.variance)} vs budget</small></div><div><span>ACTUAL REVENUE</span><strong>${money(m.a)}</strong></div></div><div class="chart"><svg viewBox="0 0 740 300" role="img" aria-label="Cumulative revenue variance from budget, showing volume, mix, price and FX effects"><line x1="55" y1="${zero}" x2="712" y2="${zero}" stroke="#aebcb1" stroke-width="1.5"/><text x="8" y="${zero+4}" font-size="11" fill="#788a7d">€0</text><text x="55" y="20" font-size="11" fill="#788a7d">Cumulative difference from budget (€)</text>${steps.map((s,i)=>{let x=70+i*125,top=y(Math.max(s.start,s.end)),height=Math.max(2,Math.abs(y(s.start)-y(s.end))),color=s.value<0?'#c8786c':'#699a79';return `<line x1="${x-15}" y1="${y(s.start)}" x2="${x}" y2="${y(s.start)}" stroke="#aebcb1" stroke-dasharray="3 3"/><rect x="${x}" y="${top}" width="66" height="${height}" rx="4" fill="${color}"><title>${s.name}: ${signed(s.value)}; cumulative ${signed(s.end)}</title></rect><line x1="${x+66}" y1="${y(s.end)}" x2="${x+110}" y2="${y(s.end)}" stroke="#aebcb1" stroke-dasharray="3 3"/><text x="${x+33}" y="${s.value>=0?top-9:top+height+16}" text-anchor="middle" font-size="11" font-weight="700" fill="#465e4c">${signed(s.value)}</text><text x="${x+33}" y="279" text-anchor="middle" font-size="12" fill="#65796b">${s.name}</text>`}).join('')}<rect x="585" y="${y(Math.max(0,cumulative))}" width="66" height="${Math.max(2,Math.abs(y(cumulative)-zero))}" rx="4" fill="#295c41"/><text x="618" y="279" text-anchor="middle" font-size="12" fill="#65796b">Net gap</text></svg></div><p>The chart starts at zero (the budget). Each bar adds or subtracts a driver; the final bar is the total difference from budget. The vertical scale shows the variance, not total revenue.</p><div class="driver-list">${drivers}</div><p>Budget ${money(m.b)} ${cumulative<0?'−':'+'} ${money(Math.abs(cumulative))} = actual ${money(m.a)}. Effects are summed by country and month.</p>`
}
function table(cs){let q=state.query.toLowerCase(), sorted=cs.filter(c=>c.name.toLowerCase().includes(q)).sort((a,b)=>{let x=a[state.sort],y=b[state.sort];return (typeof x==='string'?x.localeCompare(y):x-y)*state.direction});return `<div class="tablewrap"><table><thead><tr>${[['name','Country'],['a','Revenue'],['variance','vs budget'],['ly','Last year'],['rate','Margin rate'],['status','Flag']].map(([k,v])=>`<th ${k!=='status'?`onclick="sortBy('${k}')"`:''}>${v} ${k===state.sort?'↕':''}</th>`).join('')}</tr></thead><tbody>${sorted.map(c=>`<tr><td><button class="textbutton" onclick="detail('${c.name}')">${c.name} ↗</button></td><td>${money(c.a)}</td><td class="${cls(c.variance)}">${pct(c.variance)}</td><td>${money(c.ly)}</td><td>${pct(c.rate)}</td><td><span class="flag ${c.variance>.05?'good':c.variance<-.05?'':'neutral'}">${c.variance>.05?'Above +5%':c.variance<-.05?'Below −5%':'Within range'}</span></td></tr>`).join('')}</tbody></table>${sorted.length?'':'<div class="empty">No countries match your search.</div>'}</div>`}function sortBy(k){state.direction=state.sort===k?-state.direction:1;state.sort=k;render()}
function downloadCSV(){let keys=Object.keys(rows[0]),csv=[keys.join(','),...rows.map(r=>keys.map(k=>typeof r[k]==='number'?r[k].toFixed(6):'"'+r[k].replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='dummy-pnl.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){let info={overview:['01 / EXECUTIVE REVIEW','Performance overview','A clear view of the month, from headline results to markets needing attention.','Read the cards first, then use the trend and country ranking to investigate the result.'],drivers:['02 / REVENUE ANALYSIS','Variance drivers','Understand the movements between budget and actual revenue.','The waterfall starts at budget and adds four effects to reach actual revenue.'],countries:['03 / MARKET COMPARISON','Country performance','Compare markets and focus on the largest budget gaps.','Countries are flagged when revenue is more than 5% above or below budget; select a country to drill down.'],detail:['04 / MARKET DRILL-DOWN','Country detail','A closer look at the selected market and its commercial mix.','Select a country to explore its results; brand and channel filters remain active.'],definitions:['05 / METHODOLOGY','Definitions & data','A transparent guide to the data and calculations behind the dashboard.','Figures are illustrative; download the dataset to reproduce the calculations.']}[state.page];['eyebrow','title','subtitle','guide'].forEach((id,i)=>document.getElementById(id).textContent=info[i]);document.getElementById('nav').innerHTML=pages.map(([id,name])=>`<button class="${state.page===id?'active':''}" onclick="nav('${id}')">${name} ${state.page===id?'→':''}</button>`).join('');document.getElementById('filters').innerHTML=filter('period',[...new Set(rows.map(r=>r.date))].reverse(),state.period)+filter('country',['All',...countries.map(x=>x[0])],state.country)+filter('brand',['All',...brands.map(x=>x[0])],state.brand)+filter('channel',['All',...channels.map(x=>x[0])],state.channel)+'<button class="reset" onclick="reset()">Reset filters ↺</button>';let rs=current(),prev=previous(),cs=countryRows(rs),html='';if(state.page==='overview')html=cards(rs,prev)+`<div class="grid columns"><section class="card"><div class="sectionhead"><div><h2>Revenue over time</h2><p>Actual compared with budget</p></div><span class="pill">12 MONTHS</span></div>${trend()}</section><section class="card"><div class="sectionhead"><div><h2>Markets to review</h2><p>Ranked from lowest variance vs budget</p></div><button class="textbutton" onclick="nav('countries')">View all →</button></div>${rankings(cs)}</section></div>`;if(state.page==='drivers'){let b=bridge(rs),best=Object.entries(b).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0];html=cards(rs,prev)+`<div class="stack"><section class="card"><div class="sectionhead"><div><h2>Budget to actual revenue bridge</h2><p>Price, volume, mix and foreign exchange · EUR</p></div><span class="pill">RECONCILED</span></div>${waterfall(rs)}</section><section class="card"><h2>What moved the result?</h2><p>${best?`${best[0].toUpperCase()} was the largest absolute effect, contributing ${money(best[1])} to the variance.`:'No data for this selection.'} This describes an accounting decomposition, not a causal estimate.</p></section></div>`}if(state.page==='countries')html=`<div class="grid columns"><section class="card"><div class="sectionhead"><div><h2>Country ranking</h2><p>Revenue variance to budget, low to high</p></div></div>${rankings(cs)}</section><section class="card"><div class="sectionhead"><div><h2>Revenue by country</h2><p>Share of selected actual revenue</p></div></div>${breakdown(rs,'country')}</section></div><section class="card" style="margin-top:14px"><div class="sectionhead"><div><h2>Country detail table</h2><p>Click column headings to sort and a country to investigate.</p></div><input class="search" aria-label="Search countries" placeholder="Search countries" value="${state.query}" oninput="state.query=this.value; document.getElementById('table').innerHTML=table(countryRows(current()))"></div><div id="table">${table(cs)}</div></section>`;if(state.page==='detail'){let dr=rs.filter(r=>r.country===state.detail),dp=prev.filter(r=>r.country===state.detail);html=`<div class="filter" style="max-width:250px;margin-bottom:14px"><label for="detail-select">Selected country</label><select id="detail-select" onchange="state.detail=this.value;render()">${countries.map(c=>`<option ${c[0]===state.detail?'selected':''}>${c[0]}</option>`).join('')}</select></div>${state.country!=='All'&&state.country!==state.detail?'<div class="guide">The global country filter excludes this market. Select All or the same country to see results.</div>':''}${cards(dr,dp)}<div class="grid columns"><section class="card"><div class="sectionhead"><div><h2>${state.detail} revenue trend</h2><p>Actual vs budget</p></div></div>${trend(state.detail)}</section><section class="card"><h2>Revenue by brand</h2>${breakdown(dr,'brand')}<h2 style="margin-top:24px">Revenue by channel</h2>${breakdown(dr,'channel')}</section></div><section class="card" style="margin-top:14px"><div class="sectionhead"><div><h2>Country revenue bridge</h2><p>Budget to actual · EUR</p></div></div>${waterfall(dr)}</section>`}if(state.page==='definitions')html=`<div class="grid columns"><section class="card method"><h2>Calculation notes</h2><h3>Revenue and margin</h3>Revenue is local revenue multiplied by the relevant actual or budget FX rate. Gross profit is revenue less cost of goods sold; margin rate is gross profit divided by revenue. Budget variance is (actual − budget) / budget. Year-on-year compares the same month one year earlier. Margin-rate differences use percentage points.<h3>Bridge</h3>For each country and month, volume = (actual total units − budget total units) × budget weighted-average EUR price. Mix = actual total units × change in segment unit shares × segment budget EUR price. Price = actual segment units × change in local unit price × budget FX. FX = actual segment units × actual local price × change in FX. The effects are added across segments and markets; the ordering determines attribution.<h3>Flag</h3>Revenue more than 5% above or below budget is flagged; exactly ±5% is within range. The threshold is descriptive, not a prediction.</section><section class="card method"><h2>Dataset & assumptions</h2><p>36 months (2023–2025), six countries, three brands and three channels. Data is generated deterministically for demonstration and is not Arçelik financial data. Exchange rates are illustrative EUR per unit of local currency. Prices, volumes, seasonality, costs and FX vary across segments and time.</p><p>Each row contains month, country, currency, brand, channel, actual and budget units, local revenue, local costs and actual and budget FX. The CSV is the same dataset used by the dashboard.</p><button class="download" onclick="downloadCSV()">↓ Download dummy P&L CSV</button><h3>Five-minute demonstration</h3><p>Start with the overview, change a filter, inspect the bridge, sort the country table and open one country. Finish with the definitions and flag threshold.</p></section></div>`;document.getElementById('content').innerHTML=html}render();
</script><script>
// Treat absent observations as unavailable rather than as zero-valued results.
const populatedMetrics=metrics;
metrics=function(rs){return rs.length?populatedMetrics(rs):{a:NaN,b:NaN,g:NaN,bg:NaN,rate:NaN,brate:NaN,variance:NaN}};
render();
</script>
<style>
.variance-page{display:grid;gap:18px}.variance-hero{background:#173b2d;color:white;border-radius:14px;padding:27px 30px;display:grid;grid-template-columns:1.35fr 1fr;gap:30px}.variance-hero .eyebrow{color:#b7d1bb}.variance-hero h2{font-size:25px;line-height:1.25;letter-spacing:-.035em;margin:9px 0;color:#fff}.variance-hero p{color:#bbd0c0;max-width:600px;line-height:1.6}.hero-metrics{display:grid;grid-template-columns:repeat(3,1fr);align-items:center;border-left:1px solid #50705e;padding-left:25px;gap:14px}.hero-metrics small{display:block;color:#aec4b4;font-size:10px;text-transform:uppercase;letter-spacing:.09em}.hero-metrics strong{display:block;font-size:21px;white-space:nowrap;margin-top:8px}.hero-metrics em{font-style:normal;font-size:11px;color:#c1d5c5}.variance-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.8fr);gap:18px}.variance-panel{background:#fff;border:1px solid #e1e8e1;border-radius:14px;padding:25px 27px}.variance-panel h2{font-size:17px}.variance-panel p{font-size:12px;line-height:1.6}.variance-panel .chart{margin-top:18px}.variance-panel svg{min-width:480px}.variance-legend{display:flex;gap:18px;align-items:center;color:#7d8f82;font-size:11px;flex-wrap:wrap}.variance-legend span:before{content:'';display:inline-block;width:9px;height:9px;border-radius:2px;background:#5f9473;margin-right:6px}.variance-legend span:nth-child(2):before{background:#cc8173}.variance-legend span:nth-child(3):before{background:#254c39}.driver-item{padding:17px 0;border-bottom:1px solid #edf1ed}.driver-item:last-child{border:0}.driver-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.driver-top strong{font-size:13px}.driver-top b{font-size:14px}.driver-desc{font-size:11px;color:#839187;margin-top:3px}.driver-bar{height:5px;background:#edf2ec;border-radius:5px;margin-top:10px}.driver-bar i{display:block;height:100%;border-radius:5px}.variance-foot{color:#819087;font-size:11px;line-height:1.55;border-top:1px solid #edf1ed;margin-top:18px;padding-top:13px}.variance-foot strong{color:#526b59}@media(max-width:1050px){.variance-layout{grid-template-columns:1fr}.variance-hero{grid-template-columns:1fr}.hero-metrics{border:0;border-top:1px solid #50705e;padding:18px 0 0}}@media(max-width:600px){.variance-hero,.variance-panel{padding:20px}.hero-metrics{gap:6px}.hero-metrics strong{font-size:16px}}
</style>
<script>
const baseRender=render;
render=function(){
  baseRender();
  if(state.page!=='drivers')return;
  const rs=current(), root=document.getElementById('content');
  if(!rs.length){root.innerHTML='<section class="card empty">No results for this selection. Adjust the filters to see the revenue bridge.</section>';return}
  const m=metrics(rs), b=bridge(rs), effects=[['Volume',b.volume,'Changes in total units sold'],['Mix',b.mix,'Changes in the sales mix'],['Price',b.price,'Changes in local selling prices'],['FX',b.fx,'Changes in exchange rates']];
  const signed=v=>(v<0?'−':v>0?'+':'')+money(Math.abs(v)), net=m.a-m.b;
  const leading=[...effects].sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0], maxEffect=Math.max(...effects.map(e=>Math.abs(e[1])),1);
  const trendWord=net<0?'below':net>0?'above':'in line with';
  const headline=net===0?'Revenue finished in line with budget':`Revenue finished ${money(Math.abs(net))} ${trendWord} budget`;
  let cumulative=0;const steps=effects.map(([name,value])=>{let start=cumulative;cumulative+=value;return {name,value,start,end:cumulative}});
  const values=[0,net,...steps.flatMap(s=>[s.start,s.end])], low=Math.min(...values), high=Math.max(...values), padding=Math.max((high-low)*.22,1), y=v=>225-(v-(low-padding))/(high-low+2*padding)*175,zero=y(0);
  const bar=(s,i)=>{let x=52+i*111, top=y(Math.max(s.start,s.end)),h=Math.max(Math.abs(y(s.start)-y(s.end)),2),fill=s.value<0?'#cc8173':'#5f9473';return `<line x1="${x-28}" y1="${y(s.start)}" x2="${x}" y2="${y(s.start)}" stroke="#b5c2b7" stroke-dasharray="3 4"/><rect x="${x}" y="${top}" width="61" height="${h}" rx="3" fill="${fill}"><title>${s.name}: ${signed(s.value)}</title></rect><line x1="${x+61}" y1="${y(s.end)}" x2="${x+83}" y2="${y(s.end)}" stroke="#b5c2b7" stroke-dasharray="3 4"/><text x="${x+30}" y="${s.value>=0?top-9:top+h+16}" text-anchor="middle" font-size="11" font-weight="700" fill="#3b5543">${signed(s.value)}</text><text x="${x+30}" y="283" text-anchor="middle" font-size="11" fill="#718477">${s.name}</text>`};
  root.innerHTML=`<div class="variance-page"><section class="variance-hero"><div><div class="eyebrow">MONTHLY REVENUE / MANAGEMENT VIEW</div><h2>${headline}</h2><p>${leading[0]} was the largest driver by absolute value, ${leading[1]<0?'reducing':'increasing'} revenue by ${money(Math.abs(leading[1]))}. The chart explains how each movement contributes to the final gap.</p></div><div class="hero-metrics"><div><small>Budget</small><strong>${money(m.b)}</strong><em>Planned revenue</em></div><div><small>Actual</small><strong>${money(m.a)}</strong><em>Reported revenue</em></div><div><small>Variance</small><strong>${pct(m.variance)}</strong><em>${signed(net)} vs budget</em></div></div></section><div class="variance-layout"><section class="variance-panel"><div class="sectionhead"><div><h2>Revenue variance bridge</h2><p>Cumulative movement from budget · EUR</p></div><span class="pill">RECONCILED</span></div><div class="variance-legend"><span>Favourable</span><span>Unfavourable</span><span>Net variance</span></div><div class="chart"><svg viewBox="0 0 650 305" role="img" aria-label="Cumulative revenue variance from budget, broken down by volume, mix, price and FX"><line x1="24" y1="${zero}" x2="632" y2="${zero}" stroke="#9fb0a3" stroke-width="1.2"/><text x="4" y="${zero-7}" font-size="10" fill="#809184">0</text>${steps.map(bar).join('')}<rect x="520" y="${y(Math.max(0,net))}" width="68" height="${Math.max(2,Math.abs(y(net)-zero))}" rx="3" fill="#254c39"/><text x="554" y="${net>=0?y(net)-9:y(net)+17}" text-anchor="middle" font-size="11" font-weight="700" fill="#254c39">${signed(net)}</text><text x="554" y="283" text-anchor="middle" font-size="11" fill="#526c59">Net variance</text></svg></div><div class="variance-foot"><strong>How to read:</strong> Start at zero, the budget baseline. Each bar adds or subtracts its effect; the final bar is the total gap. The vertical scale shows the variance, not total revenue.</div></section><section class="variance-panel"><div class="sectionhead"><div><h2>Driver breakdown</h2><p>Individual contribution to the revenue gap</p></div></div>${effects.map(([name,v,description])=>`<div class="driver-item"><div class="driver-top"><strong>${name}</strong><b class="${cls(v)}">${signed(v)}</b></div><div class="driver-desc">${description}</div><div class="driver-bar"><i style="width:${Math.abs(v)/maxEffect*100}%;background:${v<0?'#cc8173':'#5f9473'}"></i></div></div>`).join('')}<div class="variance-foot"><strong>Reconciliation</strong><br>${money(m.b)} budget ${net<0?'−':'+'} ${money(Math.abs(net))} variance = ${money(m.a)} actual.<br>Contributions are an accounting decomposition, not causal estimates.</div></section></div></div>`;
  document.getElementById('guide').textContent='Read the headline first, then follow each bridge step to see how revenue moved from budget to actual.';
};
render();
</script><script src="model-data.js"></script><script src="phase2.js"></script></body></html>
